<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>آلة حاسبة</title>

<style>
    body {
        background: #f0f0f0;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .calculator {
        background: #ffffff;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
        width: 320px;
    }

    #result {
        width: 100%;
        height: 60px;
        font-size: 26px;
        text-align: right;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #bbb;
        margin-bottom: 20px;
        background: #f9f9f9;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    .btn {
        padding: 18px;
        font-size: 20px;
        border: none;
        background: #e4e4e4;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn:hover {
        background: #d1d1d1;
    }

    .equal {
        background: #4caf50;
        color: white;
    }

    .equal:hover {
        background: #449d48;
    }

    .clear {
        background: #ff7979;
        color: white;
    }

    .clear:hover {
        background: #e06666;
    }
</style>

</head>
<body>

<div class="calculator">

    <input type="text" id="result" disabled>

    <div class="buttons">
        <button class="btn" onclick="add('7')">7</button>
        <button class="btn" onclick="add('8')">8</button>
        <button class="btn" onclick="add('9')">9</button>
        <button class="btn" onclick="add('/')">÷</button>

        <button class="btn" onclick="add('4')">4</button>
        <button class="btn" onclick="add('5')">5</button>
        <button class="btn" onclick="add('6')">6</button>
        <button class="btn" onclick="add('*')">×</button>

        <button class="btn" onclick="add('1')">1</button>
        <button class="btn" onclick="add('2')">2</button>
        <button class="btn" onclick="add('3')">3</button>
        <button class="btn" onclick="add('-')">−</button>

        <button class="btn" onclick="add('0')">0</button>
        <button class="btn" onclick="add('.')">.</button>
        <button class="btn equal" onclick="calculate()">=</button>
        <button class="btn" onclick="add('+')">+</button>

        <button class="btn clear" style="grid-column: span 4;" onclick="clearResult()">مسح الكل</button>
    </div>

</div>

<script>
    function add(value) {
        document.getElementById("result").value += value;
    }

    function calculate() {
        try {
            let res = eval(document.getElementById("result").value);
            document.getElementById("result").value = res;
        } catch {
            document.getElementById("result").value = "خطأ";
        }
    }

    function clearResult() {
        document.getElementById("result").value = "";
    }
</script>

</body>
</html>
